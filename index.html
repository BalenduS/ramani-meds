*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:8px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.toprow h1{font-size:28px;line-height:1.1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;padding-top:4px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.sync.live i{background:#2E9B67}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-top:12px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:1px}
.day .w{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day .d{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1}
.day .b{width:28px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px}
.day .b i{display:block;height:100%;background:#2E9B67}
.day.today{border-color:var(--brand)}
.day.today .w{color:var(--brand)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] .w{color:var(--bg);opacity:.8}

main{padding-top:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px);display:flex;flex-direction:column;gap:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chipf{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 9px;font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center;color:var(--ink2)}
.chipf svg{width:17px;height:17px}
.chipf[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.next{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--brand);color:var(--on-strong)}
.next.due{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.next.done{background:var(--ok-soft);color:var(--ink)}
.next .k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.next.due .k{color:var(--warn);opacity:1}.next.done .k{color:var(--ok);opacity:1}
.next .t{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.next .names{font-size:16px}
.next .go{height:52px;border:0;border-radius:14px;background:var(--surface);color:var(--brand);font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center;justify-content:center}
.next.due .go{background:var(--warn);color:var(--surface)}
.next .go svg{width:20px;height:20px}

.card.hot{border:2px solid var(--c);padding:13px}

[data-mode="med"] .badge{border-radius:50%}

.body{display:flex;flex-direction:column;gap:8px;min-width:0}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:700;font-size:17px}
.nm small{font-weight:400;color:var(--muted);font-size:14px}
.why{font-size:14px;color:var(--ink2)}
.whyb{flex:none;border:0;background:var(--cs);color:var(--ct);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;display:flex;gap:4px;align-items:center}
.whyb svg{width:15px;height:15px}
.doses{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dose{min-height:36px;border-radius:10px;padding:5px 10px;font-size:14px;font-weight:700;display:flex;gap:5px;align-items:center;border:1px dashed var(--line2);background:transparent;color:var(--ct)}
.dose svg{width:15px;height:15px}
.dose.given{border:1px solid transparent;background:var(--ok-soft);color:var(--ok)}
.dose.next{border:1px solid transparent;background:var(--c);color:var(--on-strong)}
.dose.due{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn)}
.dose .by{font-weight:400;opacity:.85}
.course{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.course.end{color:var(--warn)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}

.c-tab{--c:var(--t-tab);--cs:var(--t-tab-s);--ct:var(--t-tab-t)}
.c-neb{--c:var(--t-neb);--cs:var(--t-neb-s);--ct:var(--t-neb-t)}
.c-air{--c:var(--t-air);--cs:var(--t-air-s);--ct:var(--t-air-t)}

.install{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.install .tx{flex:1;min-width:0;font-size:14px;color:var(--ink2)}
.install .tx b{display:block;color:var(--ink);font-size:16px}
.install .x{width:36px;height:36px;font-size:20px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:16px}
.stockb{border:0;background:var(--bg);color:var(--ink2);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:700;min-height:32px}
.stockb.low{background:var(--warn-soft);color:var(--warn)}
.stockb.none{background:transparent;border:1px dashed var(--line2);color:var(--muted)}
.stockrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.stockrow:first-child{border-top:0;padding-top:0}
.stockrow .q{font-size:14px;color:var(--muted)}
.stockrow .q.low{color:var(--warn);font-weight:700}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700}
.stepper input{width:100px;text-align:center;font-size:26px;font-weight:700;font-family:var(--display);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px}
[data-mode="med"] .m-wys{--c:var(--m-wys);--cs:var(--m-wys-s);--ct:var(--m-wys-t)}
[data-mode="med"] .m-pul{--c:var(--m-pul);--cs:var(--m-pul-s);--ct:var(--m-pul-t)}

.planrow .dt span{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.dots i.g{background:#2E9B67}.dots i.p{background:var(--warn)}.dots i.n{background:transparent;border:2px dashed var(--line2)}
.planrow .cnt{font-size:13px;color:var(--muted);font-weight:700}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--brand);font-weight:700}

.scrim{position:fixed;inset:0;background:rgba(10,14,18,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:16px;max-height:88vh;overflow-y:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line)}
.sh-hd{display:flex;justify-content:space-between;gap:12px;align-items:center}
.sh-hd .l{display:flex;gap:12px;align-items:center;min-width:0}
.sh-hd h2{font-size:24px;line-height:1.1}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);font-size:22px;color:var(--ink2);flex:none}
.whybox{background:var(--cs);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.whybox .eyebrow{color:var(--ct)}
.whybox p{margin:0;font-size:17px;line-height:1.5}
.caution{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px}
.err{color:var(--danger);font-size:14px;font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

function spoCard(){
  const t=todayIdx(),list=checksFor(),nm=nowMin();
  let nextId=null;
  if(sel===t){const f=list.find(c=>toMin(c.t)>nm&&!log.has(key(sel,'chk',c.id)));nextId=f?f.id:null}
  const missed=sel===t?list.filter(c=>toMin(c.t)<=nm&&!log.has(key(sel,'chk',c.id))):[];
  const lastDue=missed.length?missed[missed.length-1].id:null;
  const done=list.filter(c=>log.has(key(sel,'chk',c.id))).length;
  let chips='';
  list.forEach(c=>{
    const r=log.get(key(sel,'chk',c.id)),lbl=fmt(c.t,true);
    const past=sel<t||(sel===t&&toMin(c.t)<=nm);
    const cl=r?'given':c.id===lastDue?'due':c.id===nextId?'next':past?'due':'';
    const rd=spo.get(key(sel,'chk',c.id));
    const inner=r?I.check+lbl+(rd?' · <b>'+rd.v+'%</b>':'')+(r.by?' <span class="by">· '+esc(r.by)+'</span>':''):c.id===lastDue?lbl+' · due':c.id===nextId?lbl+' · next':lbl;
    chips+='<button class="dose '+cl+'" data-d="'+sel+'" data-s="chk" data-m="'+c.id+'" aria-label="SpO2 check '+fmt(c.t)+(r?', done':', not done')+'">'+inner+'</button>';
  });
  const reads=list.map(c=>spo.get(key(sel,'chk',c.id))).filter(Boolean).sort((a,b)=>new Date(b.at)-new Date(a.at));
  const lastTxt=reads.length?'Last '+reads[0].v+'%'+(reads[0].p?', pulse '+reads[0].p:'')+' · ':'';
  const status=lastTxt+(sel!==t?done+' of '+list.length+' checks done':lastDue?'Check is due now':nextId?'Next check at '+fmt(CHECKS.find(c=>c.id===nextId).t):done===list.length?'All checks done today':'Paused until 6 AM');
  return '<article class="card c-spo'+(lastDue?' hot':'')+'">'+badge(SPO)+'<div class="body"><div class="hd"><div><div class="nm">SpO₂ check <small>every 3 hours</small></div><div class="why">'+status+' · pauses at bedtime</div></div>'+
    '<button class="whyb" data-why="spo" aria-label="Why check SpO2">'+I.info+'Why?</button></div><div class="doses">'+chips+'</div></div></article>';
}

/* ---------- stock ---------- */
function bindStock(){$('view').querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>openStock(b.dataset.stock))}
function openStock(id){
  const m=MEDS.find(x=>x.id===id),so=stockOf(m),u=UNIT[m.type];
  openSheet('<div class="sh-hd '+cls(m)+'"><div class="l">'+badge(m)+'<div><h2>'+esc(m.name)+'</h2><div class="note">'+(so?so.left+' '+u+' left · about '+so.days+' days':'Not counted yet')+'</div></div></div><button class="x" data-close aria-label="Close">×</button></div>'+
    '<label class="field" for="st-n">How many '+u+' are in the house now?</label>'+
    '<div class="stepper"><button type="button" id="st-m" aria-label="One less">−</button><input id="st-n" type="number" inputmode="numeric" min="0" max="999" value="'+(so?so.left:'')+'" placeholder="0"><button type="button" id="st-p" aria-label="One more">+</button></div>'+
    '<p class="note" style="margin:0">She uses '+m.slots.length+' a day. Each tick takes one off the count.'+(srvStock?' Shared with everyone.':' Saved on this phone.')+'</p>'+
    '<button class="btn wide" id="st-save">Save count</button>',
    close=>{
      const inp=$('st-n'),step=d=>{inp.value=Math.max(0,(+inp.value||0)+d)};
      $('st-m').onclick=()=>step(-1);$('st-p').onclick=()=>step(1);
      $('st-save').onclick=()=>{const n=parseInt(inp.value,10);if(isNaN(n)||n<0)return toast('Enter a number');
        close();saveStock(id,n)};
    });
}

async function saveStock(id,n){
  const m=MEDS.find(x=>x.id===id),u=UNIT[m.type];
  if(srvStock){
    if(!pin||!me)return openSetup();
    const{error}=await sb.rpc('set_stock',{p_pin:pin,p_med:id,p_count:n,p_by:me});
    if(error)return toast(/wrong_pin/.test(error.message)?'Wrong PIN. Enter it again.':'Not saved: no connection. Try again.');
  }
  stock[id]={n,at:new Date().toISOString(),by:me};ls.set('rm-stock',stock);render();toast(m.name+': '+n+' '+u);
}
function openSpo(d,id){
  const c=CHECKS.find(x=>x.id===id);
  openSheet('<div class="sh-hd c-spo"><div class="l">'+badge(SPO)+'<div><h2>SpO₂ check</h2><div class="note">'+fmt(c.t)+' · '+dateLabel(d)+'</div></div></div><button class="x" data-close aria-label="Close">×</button></div>'+
    '<label class="field" for="sp-v">SpO₂ reading (%)</label>'+
    '<div class="stepper"><button type="button" id="sp-m" aria-label="One less">−</button><input id="sp-v" type="number" inputmode="numeric" min="50" max="100" placeholder="95"><button type="button" id="sp-p" aria-label="One more">+</button></div>'+
    '<label class="field" for="sp-pr">Pulse (optional)<input id="sp-pr" type="number" inputmode="numeric" min="30" max="220" placeholder="e.g. 88"></label>'+
    (srvSpo?'':'<p class="note" style="margin:0">Readings are kept once the database update is done. For now this saves the tick.</p>')+
    '<div class="err" id="sp-err" hidden></div><button class="btn wide" id="sp-save">Save reading</button>',
    close=>{
      const v=$('sp-v'),step=k=>{v.value=Math.min(100,Math.max(50,(+v.value||95)+k))};
      $('sp-m').onclick=()=>step(-1);$('sp-p').onclick=()=>step(1);
      $('sp-save').onclick=async()=>{
        const val=parseInt(v.value,10),pr=$('sp-pr').value?parseInt($('sp-pr').value,10):null,err=$('sp-err');err.hidden=true;
        if(isNaN(val)||val<50||val>100){err.textContent='Enter the SpO₂ number from the oximeter, between 50 and 100.';err.hidden=false;return}
        if(pr!==null&&(isNaN(pr)||pr<30||pr>220)){err.textContent='Pulse should be between 30 and 220, or leave it empty.';err.hidden=false;return}
        close();saveSpo(d,id,val,pr);
      };
    });
}
async function saveSpo(d,id,val,pr){
  if(!pin||!me)return openSetup();
  if(!srvSpo)return setDose(d,'chk',[id],true);
  const k=key(d,'chk',id),prevL=log.get(k),prevS=spo.get(k),now=new Date().toISOString();
  log.set(k,{at:now,by:me});spo.set(k,{v:val,p:pr,at:now,by:me});render();
  const{error}=await sb.rpc('save_spo2',{p_pin:pin,p_day:d,p_check:id,p_value:val,p_pulse:pr,p_by:me});
  if(error){prevL?log.set(k,prevL):log.delete(k);prevS?spo.set(k,prevS):spo.delete(k);render();
    return toast(/wrong_pin/.test(error.message)?'Wrong PIN. Enter it again.':'Not saved: no connection. Try again.')}
  saveLocal();toast('SpO₂ '+val+'% saved');
}
async function clearSpo(d,id){
  const k=key(d,'chk',id),prevL=log.get(k),prevS=spo.get(k);
  log.delete(k);spo.delete(k);render();
  const{error}=await sb.rpc('clear_spo2',{p_pin:pin,p_day:d,p_check:id});
  if(error){if(prevL)log.set(k,prevL);if(prevS)spo.set(k,prevS);render();return toast('Not removed: no connection. Try again.')}
  saveLocal();toast('Tick removed');
}

/* ---------- install ---------- */
function isStandalone(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}}
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installBanner(){
  if(isStandalone()||installHidden)return'';
  return '<div class="install"><span style="color:var(--brand);display:grid">'+I.dl+'</span><div class="tx"><b>Install the app</b>Add it to the home screen for one-tap access.</div><button class="btn" data-install style="padding:10px 14px">Install</button><button class="x" data-inst-x aria-label="Hide">×</button></div>';
}
function bindInstall(){$('view').querySelectorAll('[data-install]').forEach(b=>b.onclick=doInstall)}
async function doInstall(){
  if(deferredInstall){
    deferredInstall.prompt();
    try{const c=await deferredInstall.userChoice;if(c&&c.outcome==='accepted')toast('Installing…')}catch(e){}
    deferredInstall=null;return;
  }
  const steps=isIOS
    ?'<ol class="steps"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button, the square with an arrow pointing up.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>. The app appears on the home screen.</li></ol>'
    :'<ol class="steps"><li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu at the top right.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Tap <b>Install</b>.</li></ol>';
  openSheet('<div class="sh-hd"><h2>Install the app</h2><button class="x" data-close aria-label="Close">×</button></div>'+steps+'<p class="note" style="margin:0">After that, open it from the home screen. Ticks stay synced with everyone.</p>');
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('Installed');render()});

/* ---------- sheets ---------- */
function openSheet(html,onBind){
  const l=$('layer');l.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div></div>';
  const close=()=>{l.innerHTML=''};
  $('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')close()});
  l.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  if(onBind)onBind(close);
  const f=l.querySelector('input,button.btn');if(f)setTimeout(()=>f.focus(),50);
}
function openWhy(id){
  const m=id==='spo'?SPO:MEDS.find(x=>x.id===id);
  const when=m.slots?m.slots.map(s=>fmt(times[s])).join(' and '):checksFor().map(c=>fmt(c.t,true)).join(', ');
  const course=m.days?(m.days<DAYS?m.days+' days · last dose '+dateLabel(m.days-1):'15 days · until '+dateLabel(DAYS-1)):'Until the review visit';
  let given='';if(m.slots){let g=0,t=0;for(let d=0;d<m.days;d++)m.slots.forEach(s=>{t++;if(log.has(key(d,s,m.id)))g++});given='<dt>Given</dt><dd>'+g+' of '+t+' doses</dd>'}
  openSheet('<div class="sh-hd '+cls(m)+'"><div class="l">'+badge(m)+'<div><h2>'+esc(m.name)+'</h2><div class="note">'+esc(m.generic)+'</div></div></div><button class="x" data-close aria-label="Close">×</button></div>'+
    '<div class="whybox '+cls(m)+'"><span class="eyebrow">'+(m.type==='spo'?'Why we check':m.id==='o2'?'Why she uses it':'Why she takes it')+'</span><p>'+esc(m.why)+'</p></div>'+
    '<dl class="kv"><dt>When</dt><dd><b>'+when+'</b></dd>'+(m.type==='spo'?'':'<dt>Course</dt><dd>'+course+'</dd>'+given)+(UNIT[m.type]&&stockOf(m)?'<dt>At home</dt><dd>'+stockOf(m).left+' '+UNIT[m.type]+'</dd>':'')+'</dl>'+
    (m.caution?'<div class="caution">'+esc(m.caution)+'</div>':'')+
    '<p class="note" style="margin:0">Plain-language summary for family. Dose and timing come from the discharge summary.</p>');
}
function confirmUndo(d,s,id){
  const r=log.get(key(d,s,id));
  openSheet('<div class="sh-hd"><h2>Undo this tick?</h2><button class="x" data-close aria-label="Close">×</button></div>'+
    '<p style="margin:0">'+esc(nameOf(id))+', '+fmt(timeOf(s,id))+' on '+dateLabel(d)+' was marked done'+(r&&r.at?' at '+clock(r.at):'')+(r&&r.by?' by '+esc(r.by):'')+'.</p>'+
    '<div style="display:flex;gap:10px"><button class="btn ghost" data-close style="flex:1;height:52px;font-size:16px">Keep it</button><button class="btn" id="undo" style="flex:1;background:var(--danger);color:var(--surface)">Remove tick</button></div>',
    close=>{$('undo').onclick=()=>{close();if(s==='chk'&&srvSpo)clearSpo(d,id);else setDose(d,s,[id],false)}});
}
function openSetup(force){
  openSheet('<div class="sh-hd"><h2>'+(me&&pin?'Change PIN':'Welcome')+'</h2>'+(force?'<button class="x" data-close aria-label="Close">×</button>':'')+'</div>'+
    '<p style="margin:0">Everyone at home shares this schedule. Ticks show up on every phone within a few seconds.</p>'+
    '<label class="field" for="s-name">Your name<input id="s-name" maxlength="40" value="'+esc(me)+'" autocomplete="given-name" placeholder="e.g. Balendu"></label>'+
    '<label class="field" for="s-pin">Family PIN<input id="s-pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="4 digits"></label>'+
    '<div class="err" id="s-err" hidden></div><button class="btn wide" id="s-go">Continue</button>',
    close=>{
      const go=async()=>{
        const n=$('s-name').value.trim(),p=$('s-pin').value.trim(),err=$('s-err');err.hidden=true;
        if(!n){err.textContent='Enter your name.';err.hidden=false;return}
        if(!/^\d{4,8}$/.test(p)){err.textContent='Enter the 4-digit family PIN.';err.hidden=false;return}
        $('s-go').disabled=true;$('s-go').textContent='Checking…';
        const{data,error}=await sb.rpc('verify_pin',{p_pin:p});
        $('s-go').disabled=false;$('s-go').textContent='Continue';
        if(error){err.textContent='Could not reach the server. Check the internet connection.';err.hidden=false;return}
        if(!data){err.textContent='That PIN is not right. Ask Balendu for the family PIN.';err.hidden=false;return}
        me=n;pin=p;ls.set('rm-name',me);ls.set('rm-pin',pin);close();render();toast('Welcome, '+me);
      };
      $('s-go').onclick=go;$('s-pin').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
    });
}
let tt;function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}

/* ---------- data ---------- */
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}}):null;
function saveLocal(){ls.set('rm-log',Object.fromEntries(log));ls.set('rm-spo',Object.fromEntries(spo))}
async function setDose(d,s,ids,given){
  if(!ids.length)return;
  if(!pin||!me)return openSetup();
  const prev=ids.map(id=>[id,log.get(key(d,s,id))]);
  ids.forEach(id=>given?log.set(key(d,s,id),{at:new Date().toISOString(),by:me}):log.delete(key(d,s,id)));
  render();
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  const{error}=sb?await sb.rpc('set_dose',{p_pin:pin,p_day:d,p_slot:dbSlot(s),p_meds:ids,p_given:given,p_by:me}):{error:{message:'offline'}};
  if(error){
    prev.forEach(([id,v])=>v?log.set(key(d,s,id),v):log.delete(key(d,s,id)));render();
    if(/wrong_pin/.test(error.message)){pin='';ls.set('rm-pin','');openSetup();toast('PIN changed. Enter the new one.')}
    else toast('Not saved: no connection. Try again.');
    return;
  }
  saveLocal();
  toast(given?(ids.length>1?ids.length+' ticked':'Ticked'):'Tick removed');
}
async function load(){
  if(!sb)return;
  const[a,b,c,e]=await Promise.all([sb.from('dose_log').select('day,slot,med_id,given_at,given_by'),sb.from('settings').select('key,value'),
    sb.from('spo2_reading').select('day,check_id,value,pulse,taken_at,taken_by'),sb.from('med_stock').select('med_id,count,set_at,set_by')]);
  srvSpo=!c.error;srvStock=!e.error;
  if(srvSpo)spo=new Map(c.data.map(r=>[key(r.day,'chk',r.check_id),{v:r.value,p:r.pulse,at:r.taken_at,by:r.taken_by}]));
  if(srvStock){stock={};e.data.forEach(r=>{stock[r.med_id]={n:r.count,at:r.set_at,by:r.set_by}});ls.set('rm-stock',stock)}
  if(a.error||b.error){live=false;renderHeader();return}
  log=new Map(a.data.map(r=>[key(r.day,appSlot(r.slot,r.med_id),r.med_id),{at:r.given_at,by:r.given_by}]));saveLocal();
  const t=(b.data.find(x=>x.key==='times')||{}).value;if(t){times=Object.assign(times,t);times.noon='14:00';times.dawn='06:00';ls.set('rm-times',t)}
  if(tab!=='help')render();else renderHeader();
}
let ch;
function subscribe(){
  if(!sb)return;
  if(ch)sb.removeChannel(ch);
  let timer;const soon=()=>{clearTimeout(timer);timer=setTimeout(load,250)};
  ch=sb.channel('ramani-meds').on('postgres_changes',{event:'*',schema:'public',table:'dose_log'},soon).on('postgres_changes',{event:'*',schema:'public',table:'settings'},soon)
    .on('postgres_changes',{event:'*',schema:'public',table:'spo2_reading'},soon).on('postgres_changes',{event:'*',schema:'public',table:'med_stock'},soon)
    .subscribe(st=>{live=st==='SUBSCRIBED';renderHeader();if(live)load()});
}

render();
if(!sb){toast('Offline. Showing the last saved ticks.')}
else{load();subscribe()}
if(!me||!pin)setTimeout(()=>openSetup(false),300);
setInterval(()=>{if(tab!=='help'&&!document.querySelector('#layer .scrim'))render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();if(!live)subscribe()}});
window.addEventListener('online',()=>{load();subscribe()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
