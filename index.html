<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramani's Medicines</title>
<meta name="theme-color" content="#F1F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ramani Meds">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: phone-first single column; sticky header, scrolling medicine cards, fixed bottom tabs. */
:root{
  --bg:#F1F4F7; --surface:#FFFFFF; --ink:#18212C; --ink2:#3D4957; --muted:#5B6878; --line:#DAE1E8; --line2:#B9C6D3;
  --brand:#2C5B88; --brand-soft:#E2EBF4; --on-strong:#FFFFFF;
  --ok:#1E5A3F; --ok-soft:#E0F1E8; --warn:#8A5200; --warn-soft:#FBEDD7; --danger:#B0281F; --danger-soft:#FBE4E1;
  /* type colours */
  --t-tab:#2C5B88; --t-tab-s:#E2EBF4; --t-tab-t:#24507A;
  --t-neb:#1F6E61; --t-neb-s:#DCEFEA; --t-neb-t:#1A5F54;
  --t-air:#5B4396; --t-air-s:#EEEAF7; --t-air-t:#4A3880;
  /* per-medicine colours */
  --m-wys:#9A5B00; --m-wys-s:#FBEDD7; --m-wys-t:#7A4800;
  --m-pul:#2C5B88; --m-pul-s:#E2EBF4; --m-pul-t:#24507A;
  --m-erd:#A33A5B; --m-erd-s:#F8E3EA; --m-erd-t:#852C48;
  --m-for:#3F4DA3; --m-for-s:#E5E8F8; --m-for-t:#323E86;
  --m-rev:#1F6E61; --m-rev-s:#DCEFEA; --m-rev-t:#1A5F54;
  --m-max:#5E6B1F; --m-max-s:#EEF1DA; --m-max-t:#4A5418;
  --m-bip:#5B4396; --m-bip-s:#EEEAF7; --m-bip-t:#4A3880;
  --m-o2:#1D6E8F; --m-o2-s:#DDEFF6; --m-o2-t:#165A75;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1318; --surface:#161D25; --ink:#E5EAF0; --ink2:#C3CDD8; --muted:#97A4B3; --line:#26313D; --line2:#3A4756;
  --brand:#86AFD9; --brand-soft:#1B2B3D; --on-strong:#0E1318;
  --ok:#7ED3AA; --ok-soft:#14302A; --warn:#EDB25C; --warn-soft:#33270F; --danger:#F08A80; --danger-soft:#3A1A18;
  --t-tab:#86AFD9; --t-tab-s:#1B2B3D; --t-tab-t:#A9C8E8;
  --t-neb:#6CC4B4; --t-neb-s:#143029; --t-neb-t:#93D8CB;
  --t-air:#B4A2E6; --t-air-s:#28213D; --t-air-t:#CBBDF0;
  --m-wys:#EDB25C; --m-wys-s:#33270F; --m-wys-t:#F3C886;
  --m-pul:#86AFD9; --m-pul-s:#1B2B3D; --m-pul-t:#A9C8E8;
  --m-erd:#EC93AE; --m-erd-s:#3A1C27; --m-erd-t:#F3B4C7;
  --m-for:#A3ACEB; --m-for-s:#20254A; --m-for-t:#C1C7F2;
  --m-rev:#6CC4B4; --m-rev-s:#143029; --m-rev-t:#93D8CB;
  --m-max:#C2CF72; --m-max-s:#2A2E14; --m-max-t:#D5DF9A;
  --m-bip:#B4A2E6; --m-bip-s:#28213D; --m-bip-t:#CBBDF0;
  --m-o2:#7CC6E3; --m-o2-s:#13303C; --m-o2-t:#A4D8EC;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:8px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.toprow h1{font-size:28px;line-height:1.1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;padding-top:4px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.sync.live i{background:#2E9B67}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-top:12px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:1px}
.day .w{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day .d{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1}
.day .b{width:28px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px}
.day .b i{display:block;height:100%;background:#2E9B67}
.day.today{border-color:var(--brand)}
.day.today .w{color:var(--brand)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] .w{color:var(--bg);opacity:.8}

main{padding-top:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px);display:flex;flex-direction:column;gap:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chipf{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 9px;font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center;color:var(--ink2)}
.chipf svg{width:17px;height:17px}
.chipf[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.next{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--brand);color:var(--on-strong)}
.next.due{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.next.done{background:var(--ok-soft);color:var(--ink)}
.next .k{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.next.due .k{color:var(--warn);opacity:1}.next.done .k{color:var(--ok);opacity:1}
.next .t{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.next .names{font-size:16px}
.next .go{height:52px;border:0;border-radius:14px;background:var(--surface);color:var(--brand);font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center;justify-content:center}
.next.due .go{background:var(--warn);color:var(--surface)}
.next .go svg{width:20px;height:20px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start}
.card.hot{border:2px solid var(--c);padding:13px}
.badge{position:relative;width:52px;height:52px;display:grid;place-items:center;background:var(--c);color:var(--on-strong)}
.badge svg{width:26px;height:26px}
.badge .ab{font-family:var(--display);font-weight:700;font-size:19px}
.badge .mini{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--c);display:grid;place-items:center}
.badge .mini svg{width:13px;height:13px}
[data-mode="type"] .badge{border-radius:14px}
[data-mode="type"] .badge .ab,[data-mode="type"] .badge .mini{display:none}
[data-mode="med"] .badge{border-radius:50%}
[data-mode="med"] .badge>svg{display:none}
.body{display:flex;flex-direction:column;gap:8px;min-width:0}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.nm{font-weight:700;font-size:17px}
.nm small{font-weight:400;color:var(--muted);font-size:14px}
.why{font-size:14px;color:var(--ink2)}
.whyb{flex:none;border:0;background:var(--cs);color:var(--ct);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;display:flex;gap:4px;align-items:center}
.whyb svg{width:15px;height:15px}
.doses{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dose{min-height:36px;border-radius:10px;padding:5px 10px;font-size:14px;font-weight:700;display:flex;gap:5px;align-items:center;border:1px dashed var(--line2);background:transparent;color:var(--ct)}
.dose svg{width:15px;height:15px}
.dose.given{border:1px solid transparent;background:var(--ok-soft);color:var(--ok)}
.dose.next{border:1px solid transparent;background:var(--c);color:var(--on-strong)}
.dose.due{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn)}
.dose .by{font-weight:400;opacity:.85}
.course{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.course.end{color:var(--warn)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}

.c-tab{--c:var(--t-tab);--cs:var(--t-tab-s);--ct:var(--t-tab-t)}
.c-neb{--c:var(--t-neb);--cs:var(--t-neb-s);--ct:var(--t-neb-t)}
.c-air{--c:var(--t-air);--cs:var(--t-air-s);--ct:var(--t-air-t)}
.c-spo,[data-mode="med"] .c-spo{--c:var(--brand);--cs:var(--brand-soft);--ct:var(--brand)}
.install{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.install .tx{flex:1;min-width:0;font-size:14px;color:var(--ink2)}
.install .tx b{display:block;color:var(--ink);font-size:16px}
.install .x{width:36px;height:36px;font-size:20px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.tog span{min-width:0}.tog small{display:block;color:var(--muted);font-size:13px}
.tog input{width:48px;height:28px;accent-color:var(--brand);flex:none}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:16px}
.stockb{border:0;background:var(--bg);color:var(--ink2);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:700;min-height:32px}
.stockb.low{background:var(--warn-soft);color:var(--warn)}
.stockb.none{background:transparent;border:1px dashed var(--line2);color:var(--muted)}
.stockrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.stockrow:first-child{border-top:0;padding-top:0}
.stockrow .q{font-size:14px;color:var(--muted)}
.stockrow .q.low{color:var(--warn);font-weight:700}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700}
.stepper input{width:100px;text-align:center;font-size:26px;font-weight:700;font-family:var(--display);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px}
[data-mode="med"] .m-wys{--c:var(--m-wys);--cs:var(--m-wys-s);--ct:var(--m-wys-t)}
[data-mode="med"] .m-pul{--c:var(--m-pul);--cs:var(--m-pul-s);--ct:var(--m-pul-t)}
[data-mode="med"] .m-erd{--c:var(--m-erd);--cs:var(--m-erd-s);--ct:var(--m-erd-t)}
[data-mode="med"] .m-for{--c:var(--m-for);--cs:var(--m-for-s);--ct:var(--m-for-t)}
[data-mode="med"] .m-rev{--c:var(--m-rev);--cs:var(--m-rev-s);--ct:var(--m-rev-t)}
[data-mode="med"] .m-max{--c:var(--m-max);--cs:var(--m-max-s);--ct:var(--m-max-t)}
[data-mode="med"] .m-bip{--c:var(--m-bip);--cs:var(--m-bip-s);--ct:var(--m-bip-t)}
[data-mode="med"] .m-o2{--c:var(--m-o2);--cs:var(--m-o2-s);--ct:var(--m-o2-t)}

.sec h2{font-size:20px;margin-bottom:10px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.alert{background:var(--danger-soft);border-color:transparent}
.alert h2{color:var(--danger)}
.alert ul{margin:0;padding-left:20px}
.phone{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.phone a{font-family:var(--display);font-weight:700;font-size:21px;color:var(--ink);text-decoration:none}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--brand);color:var(--on-strong)}
.btn.ghost{background:var(--surface);color:var(--brand);border:1px solid var(--line);padding:8px 12px;font-size:14px}
.btn.wide{width:100%;height:52px;font-size:17px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}
.field input{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:17px;min-width:0}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.note{font-size:13px;color:var(--muted)}

.planrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;width:100%}
.planrow.today{border:2px solid var(--brand);padding:9px 13px}
.planrow .dt{display:flex;flex-direction:column}
.planrow .dt b{font-family:var(--display);font-size:18px}
.planrow .dt span{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);display:block}
.dots i.g{background:#2E9B67}.dots i.p{background:var(--warn)}.dots i.n{background:transparent;border:2px dashed var(--line2)}
.planrow .cnt{font-size:13px;color:var(--muted);font-weight:700}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:560px;margin:0 auto}
nav.tabs button{border:0;background:transparent;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--brand);font-weight:700}

.scrim{position:fixed;inset:0;background:rgba(10,14,18,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:16px;max-height:88vh;overflow-y:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.grab{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line)}
.sh-hd{display:flex;justify-content:space-between;gap:12px;align-items:center}
.sh-hd .l{display:flex;gap:12px;align-items:center;min-width:0}
.sh-hd h2{font-size:24px;line-height:1.1}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);font-size:22px;color:var(--ink2);flex:none}
.whybox{background:var(--cs);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.whybox .eyebrow{color:var(--ct)}
.whybox p{margin:0;font-size:17px;line-height:1.5}
.caution{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px}
.err{color:var(--danger);font-size:14px;font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* ---------- 31 Oct plan: oxygen, breaks, SpO₂ history ---------- */
[data-mode="med"] .m-wy2{--c:var(--m-wys);--cs:var(--m-wys-s);--ct:var(--m-wys-t)}
[data-mode="med"] .m-ezd{--c:var(--m-erd);--cs:var(--m-erd-s);--ct:var(--m-erd-t)}
[data-mode="med"] .m-azf{--c:var(--m-rev);--cs:var(--m-rev-s);--ct:var(--m-rev-t)}
.o2h{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--c);color:var(--on-strong)}
.o2h.on{--c:var(--m-o2)}.o2h.bipap{--c:var(--m-bip)}
.o2h.brk{--c:var(--warn);background:var(--warn-soft);color:var(--ink);border:2px solid var(--warn);padding:15px}
.o2h.unk{--c:var(--brand);background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.o2h .k{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.o2h .k .l{display:flex;align-items:center;gap:8px}
.o2h .k svg{width:16px;height:16px}
.o2h .k .r{letter-spacing:0;text-transform:none;opacity:.9}
.o2h.brk .k .l,.o2h.brk .k .r{color:var(--warn)}
.livedot{width:10px;height:10px;border-radius:50%;background:#9FE3C2;box-shadow:0 0 0 4px rgba(159,227,194,.25)}
.o2h .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.o2h.brk .big{font-size:56px}
.o2h .sub{font-size:15px;margin-top:4px;opacity:.92}
.o2h.brk .sub,.o2h.unk .sub{color:var(--ink2);opacity:1}
.o2h .rd{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--on-strong) 15%,transparent);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.3}
.o2h.brk .rd,.o2h.unk .rd{background:var(--surface);color:var(--ink)}
.o2h .rd svg{width:20px;height:20px;flex:none}
.o2h .rd .o{opacity:.85}
.o2h.brk .rd .o,.o2h.unk .rd .o{color:var(--muted);opacity:1}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.acts .full{grid-column:1/-1}
.a1,.a2{min-height:52px;border-radius:14px;font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;justify-content:center;padding:6px 10px;text-align:center}
.a1{border:0;background:var(--surface);color:var(--c)}
.a2{border:1.5px solid currentColor;background:transparent;color:inherit}
.o2h.brk .a1,.o2h.unk .a1{background:var(--c);color:var(--surface)}
.o2h.unk .a2{color:var(--brand)}
.a1 svg,.a2 svg{width:20px;height:20px;flex:none}

}
function o2Hero(){

  const lr=lastReads(2),rdBox=lr.length?'<div class="rd">'+I.pulse+'<div>Last SpO₂ '+readLine(lr[0])+(lr[1]?'<br><span class="o">Before that '+lr[1].v+'% '+ctxName(lr[1].ctx)+' · '+clock(lr[1].at)+'</span>':'')+'</div></div>':'';
  if(c.kind==='break'){
    const r=readOf(c),st=new Date(c.at).getTime(),ra=c.remind_at?new Date(c.remind_at).getTime():null;
    let prog='';

      prog='<div><div class="prog"><i id="brk-p" style="width:'+p+'%"></i></div><div class="progl"><span>Reminder at '+clock(c.remind_at)+'</span><span id="brk-l">'+(left>0?left+' min left':'Reminder sent')+'</span></div></div>'}

      '<div><div class="big" id="brk-t">'+mmss(now-st)+'</div><div class="sub">Off oxygen since '+clock(c.at)+'</div></div>'+prog+
      (r?'<div class="rd">'+I.pulse+'<div><b>'+r.v+'%</b>'+(isLow(r.v)?'<span class="lowpill">Low</span>':'')+' SpO₂ before the break<br><span class="o">on oxygen'+(r.p?' · pulse '+r.p:'')+' · '+clock(r.at)+'</span></div></div>':'')+
      '<div class="acts"><button class="a1 full" data-o2="end">'+I.pulse+'End break · check SpO₂</button></div></section>';
  }

    '<div><div class="big">'+dur(now-new Date(c.at))+'</div><div class="sub">BiPAP on since '+clock(c.at)+(c.by?' · started by '+esc(c.by):'')+'</div></div>'+rdBox+
    '<div class="acts"><button class="a1 full" data-o2="bipoff">'+I.sun+'BiPAP off, oxygen stays on</button><button class="a2" data-o2="break">'+I.pause+'Take a break</button><button class="a2" data-o2="log">'+I.pulse+'Log SpO₂</button></div></section>';
  const pv=prevOf(c);
  return '<section class="o2h on"><div class="k"><span class="l"><span class="livedot"></span>Oxygen on</span><span class="r">1–2 L/min</span></div>'+
    '<div><div class="big">'+dur(now-new Date(c.at))+'</div><div class="sub">Running since '+clock(c.at)+(dstr(new Date(c.at))!==todayS()?' '+whenLow(c.at):'')+(c.by?' · '+(pv&&pv.kind==='break'?'restarted':'started')+' by '+esc(c.by):'')+'</div></div>'+rdBox+
    '<div class="acts"><button class="a1" data-o2="break">'+I.pause+'Take a break</button><button class="a2" data-o2="bipap">'+I.moon+'O₂ + BiPAP</button></div>'+
    '<button class="lnk" data-o2="log">Log an SpO₂ reading</button></section>';
}
function mmss(ms){const s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60);return m>=60?Math.floor(m/60)+'h '+pad(m%60)+'m':m+'m '+pad(s%60)+'s'}

function evText(e){
  const pv=prevOf(e),r=readOf(e);
  let what,detail=[];
  if(e.kind==='break')what='Break started';
  else if(e.kind==='bipap')what='Oxygen + BiPAP started';
  else if(pv&&pv.kind==='break'){what='Break ended · oxygen back on';detail.push(dur(new Date(e.at)-new Date(pv.at))+' break')}
  else if(pv&&pv.kind==='bipap')what='BiPAP off · oxygen continues';
  else what='Oxygen on';
  if(r)what+=' · SpO₂ '+r.v+'% '+ctxName(r.ctx);
  if(r&&r.p)detail.push('pulse '+r.p);
  if(e.by)detail.unshift(esc(e.by));
  return{what,detail:detail.join(' · '),low:r&&isLow(r.v)};
}

  const rows=[];
  evSorted().filter(e=>dstr(new Date(e.at))===sel).forEach(e=>{const t=evText(e);rows.push({at:e.at,h:'<button class="evrow" data-ev="'+e.id+'"><span class="t">'+clock(e.at)+'</span><span class="dot" style="background:'+KCOL[e.kind]+'"></span><span><b class="'+(t.low?'lowtxt':'')+'">'+t.what+'</b><small>'+t.detail+'</small></span></button>'})});
  reads.filter(r=>!r.ev&&dstr(new Date(r.at))===sel).forEach(r=>rows.push({at:r.at,h:'<button class="evrow" data-rd="'+r.id+'"><span class="t">'+clock(r.at)+'</span><span class="dot" style="background:var(--brand)"></span><span><b class="'+(isLow(r.v)?'lowtxt':'')+'">SpO₂ '+r.v+'% '+ctxName(r.ctx)+'</b><small>'+esc(r.by||'')+(r.p?' · pulse '+r.p:'')+'</small></span></button>'}));

    '<div class="legend"><span><i style="background:var(--m-bip)"></i>O₂ + BiPAP</span><span><i style="background:var(--m-o2)"></i>Oxygen</span><span><i style="background:var(--warn)"></i>Break</span></div>'+

}

/* ---------- oxygen actions ---------- */
function need(){if(!pin||!me){openSetup();return false}return true}
function o2Action(a){
  if(!need())return;
  if(a==='on')return addEvent('on',null,null,null,0,'Oxygen on');
  if(a==='bipoff')return addEvent('on',null,null,null,0,'BiPAP off · oxygen stays on');
  if(a==='break')return openBreakStart();
  if(a==='end')return openBreakEnd();
  if(a==='bipap')return openBipap();
  if(a==='log')return openLog();
}
function numPair(id,label,val){
  return '<div class="pair"><label for="'+id+'-v">'+label+'<span class="numin"><input id="'+id+'-v" type="number" inputmode="numeric" min="50" max="100" placeholder="95" value="'+(val||'')+'"><span>%</span></span></label>'+
    '<label for="'+id+'-p">Pulse, optional<span class="numin sm"><input id="'+id+'-p" type="number" inputmode="numeric" min="30" max="220" placeholder="—"><span>/min</span></span></label></div>';
}
function readPair(id,required){
  const v=$(id+'-v').value.trim(),p=$(id+'-p').value.trim(),err=$(id+'-err');err.hidden=true;
  const val=v?parseInt(v,10):null,pr=p?parseInt(p,10):null;
  if(required&&val==null){err.textContent='Enter the SpO₂ number from the oximeter.';err.hidden=false;return null}
  if(val!=null&&(isNaN(val)||val<50||val>100)){err.textContent='SpO₂ should be between 50 and 100.';err.hidden=false;return null}
  if(pr!=null&&(isNaN(pr)||pr<30||pr>220)){err.textContent='Pulse should be between 30 and 220, or leave it empty.';err.hidden=false;return null}
  return{val,pr};
}
function openBreakStart(){
  const opts=[[15,'15 min'],[30,'30 min'],[45,'45 min'],[0,'No reminder']];
  openSheet('<div><div class="eyebrow o2c">Step 1 of 2 · Before the break</div><h2 style="font-size:24px;margin-top:4px">Check SpO₂ while she’s still on oxygen</h2><p class="note" style="margin:6px 0 0;font-size:15px;color:var(--ink2)">Clip the oximeter on, wait for the number to settle, then enter it.</p></div>'+
    numPair('bs','SpO₂ on O₂')+

    '<div class="err" id="bs-err" hidden></div>'+

      $('bs-go').onclick=()=>{const r=readPair('bs',true);if(!r)return;remindMin=rm;ls.set('rm-remind',rm);close();addEvent('break',r.val,r.pr,'o2',rm,'Break started')};

function openBreakEnd(){

    close=>{

      inp.addEventListener('input',upd);

async function addEvent(kind,val,pr,ctx,rm,msg){
  if(busy)return;busy=true;
  const{error}=sb?await sb.rpc('o2_add',{p_pin:pin,p_kind:kind,p_spo2:val,p_pulse:pr,p_ctx:ctx,p_remind_min:rm||0,p_by:me}):{error:{message:'offline'}};
  busy=false;
  if(error)return rpcErr(error);
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  await load();toast(msg+(val!=null&&isLow(val)?' · SpO₂ below '+alertAt+'%':''));
}
function rpcErr(error){
  if(/wrong_pin/.test(error.message)){pin='';ls.set('rm-pin','');openSetup();toast('PIN changed. Enter the new one.')}
  else toast('Not saved: no connection. Try again.');
}
function confirmEvDel(id){
  const e=events.find(x=>x.id===id);if(!e)return;const t=evText(e);

function confirmRdDel(id){

function allReads(){
  const a=reads.map(r=>({id:r.id,at:r.at,v:r.v,p:r.p,ctx:r.ctx,by:r.by,ev:r.ev,src:'new'}));
  oldSpo.forEach(r=>a.push({at:r.at,v:r.v,p:r.p,ctx:'air',by:r.by,src:'old',chk:r.check}));
  return a.sort((x,y)=>new Date(y.at)-new Date(x.at));
}
function breakPairs(){
  const es=evSorted(),out=[];
  es.forEach((e,i)=>{if(e.kind!=='break')return;const nx=es[i+1];
    out.push({at:e.at,by:e.by,before:readOf(e),after:nx&&nx.kind==='on'?readOf(nx):null,mins:nx?Math.round((new Date(nx.at)-new Date(e.at))/6e4):null,open:!nx})});
  return out.reverse();
}
function chartSvg(all,days){
  const today=pdate(todayS()),first=days?addDays(today,-(days-1)):pdate(dstr(new Date(Math.min(...all.map(r=>new Date(r.at).getTime()),today.getTime()))));
  const n=Math.max(1,Math.round((today-first)/864e5)+1);
  const byDay={};all.forEach(r=>{const s=dstr(new Date(r.at));(byDay[s]=byDay[s]||{o2:[],air:[]})[r.ctx].push(r.v)});
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const pts={o2:[],air:[]};let lo=100,hi=0;
  for(let i=0;i<n;i++){const s=dstr(addDays(first,i)),b=byDay[s];if(!b)continue;['o2','air'].forEach(c=>{const v=avg(b[c]);if(v!=null){pts[c].push([i,v]);lo=Math.min(lo,v);hi=Math.max(hi,v)}})}
  if(!pts.o2.length&&!pts.air.length)return '<p class="note" style="margin:0">No readings in this range yet.</p>';
  lo=Math.min(lo,alertAt||lo);lo=Math.max(50,Math.floor((lo-2)/2)*2);hi=100;
  const Wd=356,Ht=190,L=30,T=8,B=24,pw=Wd-L-8,ph=Ht-T-B;
  const x=i=>L+(n===1?pw/2:i/(n-1)*pw),y=v=>T+(hi-v)/(hi-lo)*ph;
  let g='';const step=(hi-lo)>20?10:(hi-lo)>10?4:2;
  for(let v=hi;v>=lo;v-=step)g+='<line class="grid" x1="'+L+'" x2="'+Wd+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';
  if(alertAt&&alertAt>lo)g+='<line x1="'+L+'" x2="'+Wd+'" y1="'+y(alertAt)+'" y2="'+y(alertAt)+'" stroke="var(--danger)" stroke-dasharray="4 4"/>';
  const rv=pdate(PLAN_START),ri=Math.round((rv-first)/864e5);
  if(ri>0&&ri<n)g+='<line x1="'+x(ri)+'" x2="'+x(ri)+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="var(--line2)" stroke-dasharray="3 3"/><text x="'+(x(ri)+4)+'" y="'+(T+10)+'">31 Oct</text>';
  const lab=Math.max(1,Math.ceil(n/6));
  for(let i=0;i<n;i+=lab){const d=addDays(first,i);g+='<text x="'+x(i)+'" y="'+(Ht-6)+'" text-anchor="middle">'+(n<=7?W[d.getDay()].slice(0,2):d.getDate()+' '+M[d.getMonth()])+'</text>'}
  const line=(p,col,fill)=>p.length?'<polyline fill="none" stroke="'+col+'" stroke-width="2.5" stroke-linejoin="round" points="'+p.map(([i,v])=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')+'"/>'+p.map(([i,v])=>'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="3.5" fill="'+(fill?col:'var(--surface)')+'" stroke="'+col+'" stroke-width="2"/>').join(''):'';
  const desc='Daily average SpO₂. On oxygen: '+(pts.o2.length?Math.round(avg(pts.o2.map(p=>p[1])))+'%':'no readings')+'. Room air: '+(pts.air.length?Math.round(avg(pts.air.map(p=>p[1])))+'%':'no readings')+'.';
  return '<svg class="chart" viewBox="0 0 '+Wd+' '+Ht+'" role="img" aria-label="'+desc+'">'+g+line(pts.air,'var(--warn)',false)+line(pts.o2,'var(--m-o2)',true)+'</svg>';
}

function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
function u8(b){const p='='.repeat((4-b.length%4)%4),s=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(s,c=>c.charCodeAt(0))}
function pushSection(){
  let body;
  if(!pushSupported())body=isIOS&&!isStandalone()
    ?'<p style="margin:0">On iPhone, notifications work after the app is installed. Install it from the button above, open it from the home screen, then turn notifications on here.</p>'

  else if(!push.on)body='<p style="margin:0">Get a notification when anyone ticks a dose, starts or ends an oxygen break, or logs SpO₂. Also a reminder when a break is up, and before and after each dose.</p><button class="btn" data-push-on style="align-self:flex-start">Turn on notifications</button>';
  else body='<label class="tog" for="pn-a"><span>Updates from family<small>Ticks, oxygen breaks, SpO₂ readings, stock</small></span><input type="checkbox" id="pn-a"'+(push.activity?' checked':'')+'></label>'+
    '<label class="tog" for="pn-r"><span>Reminders<small>Break time up, and 10 min before / 30 min after each dose</small></span><input type="checkbox" id="pn-r"'+(push.reminders?' checked':'')+'></label>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" id="pn-test">Send a test</button><button class="btn ghost" id="pn-off">Turn off on this phone</button></div>';
  return '<section class="sec"><h2>Notifications on this phone</h2><div class="box">'+body+'</div></section>';
}
function bindPush(){
  const a=$('pn-a'),r=$('pn-r');
  if(a)a.onchange=()=>{push.activity=a.checked;ls.set('rm-push',push);savePush(true)};
  if(r)r.onchange=()=>{push.reminders=r.checked;ls.set('rm-push',push);savePush(true)};
  if($('pn-test'))$('pn-test').onclick=async()=>{const s=await currentSub();if(!s)return toast('Turn notifications on again');
    const{error}=await sb.rpc('test_push',{p_pin:pin,p_endpoint:s.endpoint});toast(error?'Could not send. Check the connection.':'Test sent. It should arrive in a few seconds.')};
  if($('pn-off'))$('pn-off').onclick=async()=>{const s=await currentSub();
    if(s){const j=s.toJSON();try{await sb.rpc('save_push',{p_pin:pin,p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_name:me,p_activity:false,p_reminders:false})}catch(e){}}
    push.on=false;ls.set('rm-push',push);render();toast('Notifications off on this phone')};
}
async function currentSub(){try{const reg=await navigator.serviceWorker.ready;return await reg.pushManager.getSubscription()}catch(e){return null}}
async function enablePush(){
  if(!pushSupported()){
    if(isIOS&&!isStandalone())return openSheet('<div class="sh-hd"><h2>Install first</h2><button class="x" data-close aria-label="Close">×</button></div><p style="margin:0">On iPhone, notifications work only from the installed app.</p><button class="btn wide" id="go-inst">Show me how</button>',close=>{$('go-inst').onclick=()=>{close();doInstall()}});
    return toast('This browser can’t show notifications');
  }
  if(!need())return;
  let perm;try{perm=await Notification.requestPermission()}catch(e){perm='denied'}
  if(perm!=='granted')return openSheet('<div class="sh-hd"><h2>Notifications are blocked</h2><button class="x" data-close aria-label="Close">×</button></div><p style="margin:0">Allow notifications for this app in the phone’s Settings, then tap Turn on again.</p>');
  push.activity=push.activity!==false;push.reminders=push.reminders!==false;if(!push.activity&&!push.reminders){push.activity=true;push.reminders=true}
  const ok=await savePush(false);
  if(ok){push.on=true;ls.set('rm-push',push);render();toast('Notifications on')}
}
async function savePush(quiet){
  try{
    const reg=await navigator.serviceWorker.ready;
    let s=await reg.pushManager.getSubscription();
    if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)});
    const j=s.toJSON();
    const{error}=await sb.rpc('save_push',{p_pin:pin,p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_name:me,p_activity:!!push.activity,p_reminders:!!push.reminders});
    if(error){if(!quiet)toast(/wrong_pin/.test(error.message)?'Wrong PIN. Enter it again.':'Could not turn on. Check the connection.');return false}
    return true;
  }catch(e){if(!quiet)toast('Could not turn on notifications on this phone.');return false}
}

/* ---------- install ---------- */
function isStandalone(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}}
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installBanner(){
  if(!push.on&&!pushHidden&&pushSupported()&&(isStandalone()||!isIOS))
    return '<div class="install"><span style="color:var(--brand);display:grid">'+I.bell+'</span><div class="tx"><b>Turn on notifications</b>Get oxygen break reminders and family updates.</div><button class="btn" data-push-on style="padding:10px 14px">Turn on</button><button class="x" data-push-x aria-label="Hide">×</button></div>';
  if(isStandalone()||installHidden)return'';
  return '<div class="install"><span style="color:var(--brand);display:grid">'+I.dl+'</span><div class="tx"><b>Install the app</b>Add it to the home screen for one-tap access.</div><button class="btn" data-install style="padding:10px 14px">Install</button><button class="x" data-inst-x aria-label="Hide">×</button></div>';
}
function bindInstall(){$('view').querySelectorAll('[data-install]').forEach(b=>b.onclick=doInstall);
  $('view').querySelectorAll('[data-push-on]').forEach(b=>b.onclick=enablePush);
  const px=$('view').querySelector('[data-push-x]');if(px)px.onclick=()=>{pushHidden=true;ls.set('rm-push-hide',true);render()};}
async function doInstall(){
  if(deferredInstall){
    deferredInstall.prompt();
    try{const c=await deferredInstall.userChoice;if(c&&c.outcome==='accepted')toast('Installing…')}catch(e){}
    deferredInstall=null;return;
  }
  const steps=isIOS
    ?'<ol class="steps"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button, the square with an arrow pointing up.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>. The app appears on the home screen.</li></ol>'
    :'<ol class="steps"><li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu at the top right.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Tap <b>Install</b>.</li></ol>';
  openSheet('<div class="sh-hd"><h2>Install the app</h2><button class="x" data-close aria-label="Close">×</button></div>'+steps+'<p class="note" style="margin:0">After that, open it from the home screen. Everything stays synced with everyone.</p>');
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('Installed');render()});

/* ---------- sheets ---------- */
function openSheet(html,onBind){
  const l=$('layer');l.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div></div>';
  const close=()=>{l.innerHTML=''};
  $('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')close()});
  l.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  if(onBind)onBind(close);
  const f=l.querySelector('input,button.btn');if(f)setTimeout(()=>f.focus(),50);
}
function openWhy(id){
  const m=MEDS.find(x=>x.id===id);
  let g=0;log.forEach((v,k)=>{if(k.split('|')[2]===id)g++});
  openSheet('<div class="sh-hd '+cls(m)+'"><div class="l">'+badge(m)+'<div><h2>'+esc(m.name)+' <small style="font-size:16px;font-weight:400">'+esc(m.sub)+'</small></h2><div class="note">'+esc(m.generic)+'</div></div></div><button class="x" data-close aria-label="Close">×</button></div>'+
    '<div class="whybox '+cls(m)+'"><span class="eyebrow">Why she takes it</span><p>'+esc(m.why)+'</p></div>'+
    '<dl class="kv"><dt>When</dt><dd><b>'+fmt(times.am)+' and '+fmt(times.pm)+'</b> (1-0-1)</dd><dt>Course</dt><dd>Continue, from 31 Oct</dd><dt>Ticked</dt><dd>'+g+' doses so far</dd>'+(stockOf(m)?'<dt>At home</dt><dd>'+stockOf(m).left+' '+UNIT[m.type]+'</dd>':'')+'</dl>'+
    (m.caution?'<div class="caution">'+esc(m.caution)+'</div>':'')+
    '<p class="note" style="margin:0">Plain-language summary for family. Dose and timing come from the 31 Oct prescription.</p>');
}
function confirmUndo(d,s,id){
  const r=log.get(key(d,s,id)),m=MEDS.find(x=>x.id===id);
  openSheet('<div class="sh-hd"><h2>Undo this tick?</h2><button class="x" data-close aria-label="Close">×</button></div>'+
    '<p style="margin:0">'+esc(m.name)+', '+SLOT_NAME[s].toLowerCase()+' on '+dLabel(pdate(d))+' was marked given'+(r&&r.at?' at '+clock(r.at):'')+(r&&r.by?' by '+esc(r.by):'')+'.</p>'+
    '<div style="display:flex;gap:10px"><button class="btn ghost" data-close style="flex:1;height:52px;font-size:16px">Keep it</button><button class="btn" id="undo" style="flex:1;background:var(--danger);color:var(--surface)">Remove tick</button></div>',
    close=>{$('undo').onclick=()=>{close();setDose(d,s,[id],false)}});
}
function openSetup(force){
  openSheet('<div class="sh-hd"><h2>'+(me&&pin?'Change PIN':'Welcome')+'</h2>'+(force?'<button class="x" data-close aria-label="Close">×</button>':'')+'</div>'+
    '<p style="margin:0">Everyone at home shares this schedule. Ticks and oxygen updates show up on every phone within a few seconds.</p>'+
    '<label class="field" for="s-name">Your name<input id="s-name" maxlength="40" value="'+esc(me)+'" autocomplete="given-name" placeholder="e.g. Balendu"></label>'+
    '<label class="field" for="s-pin">Family PIN<input id="s-pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="4 digits"></label>'+
    '<div class="err" id="s-err" hidden></div><button class="btn wide" id="s-go">Continue</button>',
    close=>{
      const go=async()=>{
        const n=$('s-name').value.trim(),p=$('s-pin').value.trim(),err=$('s-err');err.hidden=true;
        if(!n){err.textContent='Enter your name.';err.hidden=false;return}
        if(!/^\d{4,8}$/.test(p)){err.textContent='Enter the 4-digit family PIN.';err.hidden=false;return}
        $('s-go').disabled=true;$('s-go').textContent='Checking…';
        const{data,error}=await sb.rpc('verify_pin',{p_pin:p});
        $('s-go').disabled=false;$('s-go').textContent='Continue';
        if(error){err.textContent='Could not reach the server. Check the internet connection.';err.hidden=false;return}
        if(!data){err.textContent='That PIN is not right. Ask Balendu for the family PIN.';err.hidden=false;return}
        me=n;pin=p;ls.set('rm-name',me);ls.set('rm-pin',pin);close();render();toast('Welcome, '+me);
      };
      $('s-go').onclick=go;$('s-pin').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
    });
}
let tt;function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

/* ---------- data ---------- */
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}}):null;
function saveLocal(){ls.set('rm2-log',Object.fromEntries(log));ls.set('rm2-ev',events);ls.set('rm2-rd',reads)}
async function setDose(d,s,ids,given){
  if(!ids.length||!need())return;
  const prev=ids.map(id=>[id,log.get(key(d,s,id))]);
  ids.forEach(id=>given?log.set(key(d,s,id),{at:new Date().toISOString(),by:me}):log.delete(key(d,s,id)));
  render();
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  const{error}=sb?await sb.rpc('set_dose2',{p_pin:pin,p_date:d,p_slot:s,p_meds:ids,p_given:given,p_by:me}):{error:{message:'offline'}};
  if(error){prev.forEach(([id,v])=>v?log.set(key(d,s,id),v):log.delete(key(d,s,id)));render();return rpcErr(error)}
  saveLocal();toast(given?'Ticked':'Tick removed');
}
let oldLoaded=oldSpo.length>0;
async function load(){
  if(!sb)return;
  const q=[sb.from('med_log2').select('date,slot,med_id,given_at,given_by'),sb.from('settings').select('key,value'),
    sb.from('o2_event').select('id,at,kind,remind_at,by').order('at'),sb.from('spo2_log').select('id,at,value,pulse,ctx,event_id,by').order('at'),
    sb.from('med_stock').select('med_id,count,set_at,set_by')];
  if(!oldLoaded)q.push(sb.from('dose_log').select('day,slot,med_id,given_at,given_by'),sb.from('spo2_reading').select('day,check_id,value,pulse,taken_at,taken_by'));
  const[a,b,c,d,e,f,g]=await Promise.all(q);
  if(a.error||b.error||c.error||d.error){live=false;renderHeader();return}
  log=new Map(a.data.map(r=>[key(r.date,r.slot,r.med_id),{at:r.given_at,by:r.given_by}]));
  events=c.data;reads=d.data.map(r=>({id:r.id,at:r.at,v:r.value,p:r.pulse,ctx:r.ctx,ev:r.event_id,by:r.by}));
  const t=(b.data.find(x=>x.key==='times')||{}).value;if(t){times=Object.assign(times,t);ls.set('rm-times',t)}
  const al=b.data.find(x=>x.key==='spo2_alert');alertAt=al&&al.value!=null?+al.value:null;ls.set('rm-alert',alertAt);
  if(!e.error){stock={};e.data.forEach(r=>{stock[r.med_id]={n:r.count,at:r.set_at,by:r.set_by}});ls.set('rm-stock',stock)}
  if(f&&!f.error&&g&&!g.error){
    oldLog=new Map(f.data.map(r=>[key(r.day,r.med_id==='o2'?'am':r.slot,r.med_id),{at:r.given_at,by:r.given_by}]));
    oldSpo=g.data.map(r=>({day:r.day,check:r.check_id,v:r.value,p:r.pulse,at:r.taken_at,by:r.taken_by}));
    oldLoaded=true;ls.set('rm-old-log',Object.fromEntries(oldLog));ls.set('rm-old-spo',oldSpo);
  }
  saveLocal();
  if(tab!=='help')render();else renderHeader();
}
let ch;
function subscribe(){
  if(!sb)return;
  if(ch)sb.removeChannel(ch);
  let timer;const soon=()=>{clearTimeout(timer);timer=setTimeout(load,250)};
  ch=sb.channel('ramani-meds-2');
  ['med_log2','settings','o2_event','spo2_log','med_stock'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},soon));
  ch.subscribe(st=>{live=st==='SUBSCRIBED';renderHeader();if(live)load()});
}
function tick(){
  if(tab!=='today'||sel!==todayS())return;
  const c=current();if(!c||c.kind!=='break')return;
  const now=Date.now(),st=new Date(c.at).getTime(),el=$('brk-t');if(el)el.textContent=mmss(now-st);
  if(c.remind_at){const ra=new Date(c.remind_at).getTime(),p=$('brk-p'),l=$('brk-l');
    if(p)p.style.width=Math.min(100,Math.round((now-st)/(ra-st)*100))+'%';
    if(l){const left=Math.round((ra-now)/6e4);l.textContent=left>0?left+' min left':'Reminder sent'}}
}

render();
if(!sb){toast('Offline. Showing the last saved data.')}
else{load();subscribe()}
if(!me||!pin)setTimeout(()=>openSetup(false),300);
if(push.on&&pushSupported()&&me&&pin)setTimeout(()=>savePush(true),1500);
setInterval(tick,1000);
setInterval(()=>{if(tab!=='help'&&!document.querySelector('#layer .scrim'))render()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load();if(!live)subscribe()}});
window.addEventListener('online',()=>{load();subscribe()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
